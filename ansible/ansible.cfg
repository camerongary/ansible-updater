[defaults]
# Host key checking - disable for local network scanning
host_key_checking = False

# Inventory settings
inventory = ./hosts.yml

# Connection settings
remote_user = cameron
private_key_file = ~/.ssh/id_ed25519

# Timeout settings
timeout = 30
gather_timeout = 30
connect_timeout = 10

# Logging
log_path = /var/log/ansible/ansible.log

# Module settings
module_compression = 'gzip'

# Fact caching
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Parallel execution
forks = 10

# Display
display_skipped_hosts = False
force_color = True
deprecation_warnings = False

# Suppress Jinja2 plugin conflicts from mixed apt/pip Ansible installs
system_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
